services:
  # --- RELATIONAL DATABASE (SQL) ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: bigdata_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- NOSQL DATABASE ---
  mongo:
    image: mongo:7.0
    container_name: mongo_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # --- STREAMING PLATFORM (Kafka + Zookeeper) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- DISTRIBUTED PROCESSING (Apache Spark) ---
  spark-master:
    image: apache/spark:latest
    container_name: spark_master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: apache/spark:latest
    container_name: spark_worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"

  # --- DISTRIBUTED STORAGE (Apache Hadoop HDFS) ---
  hadoop-namenode:
    image: apache/hadoop:3.4.0
    container_name: hadoop_namenode
    restart: always
    hostname: hadoop-namenode
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    command:
      - sh
      - -c
      - |
        echo '<configuration><property><name>fs.defaultFS</name><value>hdfs://hadoop-namenode:9000</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml
        if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then hdfs namenode -format -force; fi
        hdfs namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/tmp/hadoop-root/dfs/name

  hadoop-datanode:
    image: apache/hadoop:3.4.0
    container_name: hadoop_datanode
    restart: always
    depends_on:
      - hadoop-namenode
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    command:
      - sh
      - -c
      - |
        echo '<configuration><property><name>fs.defaultFS</name><value>hdfs://hadoop-namenode:9000</value></property></configuration>' > /opt/hadoop/etc/hadoop/core-site.xml
        hdfs datanode
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/tmp/hadoop-root/dfs/data
  # --- DEVELOPMENT & AUTOMATION ENVIRONMENT ---
  jupyter-pyspark:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter_notebook
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    volumes:
      - ./notebooks:/home/jovyan/work

volumes:
  postgres_data:
  mongo_data:
  hadoop_namenode:
  hadoop_datanode:
